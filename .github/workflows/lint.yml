name: Quality

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.9", "3.11"]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest
        run: python -m pip install pytest==8.4.2

      - name: Run tests
        run: python -m pytest -q

  windows-desktop:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install desktop build and test tools
        run: python -m pip install -r scripts/windows/requirements-build.txt pytest==8.4.2
      - name: Test Windows handoff and native GUI
        run: python -m pytest -q tests/test_desktop_diagnostics.py tests/test_desktop_safety_regressions.py tests/test_tensor_bridge.py tests/test_tensor_picker.py tests/test_tensor_desktop.py tests/test_windows_tensor_launcher.py tests/test_windows_desktop_download.py
      - name: Build desktop application
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/windows/build_desktop.ps1 -Python (Get-Command python).Source
      - name: Verify packaged application without connecting
        shell: python
        run: |
          import json, pathlib, subprocess
          output = pathlib.Path('dist/smoke-test.json').resolve()
          subprocess.run(['dist/InklyDesktop.exe', '--smoke-test', str(output)], check=True, timeout=60)
          result = json.loads(output.read_text())
          assert result['frozen'] and result['askpass'] and result['ssh'], result
          assert result['window'] == 'Inkly Desktop' and result['width'] >= 940, result
      - uses: actions/upload-artifact@v4
        with:
          name: InklyDesktop-windows
          path: |
            dist/InklyDesktop.exe
            dist/smoke-test.json

  lint:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: python -m pip install ruff==0.16.7

      - name: Run Ruff
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .
